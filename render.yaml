services:
  - type: web
    name: likhkedo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Values are set in the Render dashboard, never in this file.
      - key: GNANI_API_KEY
        sync: false
      - key: EVON_BASE_URL
        sync: false
      - key: EVON_API_KEY
        sync: false
      - key: EVON_MODEL
        sync: false          # gnani/gnani-evon-v3.3-30B-A3B on vLLM, or "evon" for the llama.cpp GGUF
      - key: EVON_PROVIDER
        sync: false          # vllm | llamacpp | none (EVON_FREE.md)
      - key: EVON_QUANT
        sync: false
      - key: EVON_TIMEOUT
        value: "90"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ONLY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: /tmp/likhkedo
