services:
  - type: web
    name: likhkedo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: EVON_BASE_URL
        sync: false
      - key: EVON_API_KEY
        sync: false
      - key: EVON_MODEL
        value: gnani/gnani-evon-v3.3-30B-A3B
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ONLY
        value: "false"
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: /tmp/likhkedo
