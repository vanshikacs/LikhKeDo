
services:
  - type: web
    name: likhkedo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GNANI_API_KEY
        sync: false
      - key: EVON_BASE_URL
        sync: false
      - key: EVON_API_KEY
        sync: false
      - key: EVON_MODEL
        sync: false
      - key: EVON_PROVIDER
        sync: false
      - key: EVON_QUANT
        sync: false
      - key: EVON_TIMEOUT
        value: "90"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ONLY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: /tmp/likhkedo
