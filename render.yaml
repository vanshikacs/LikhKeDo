services:
  - type: web
    name: likhkedo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Values are set in the Render dashboard, never in this file.
      - key: GNANI_API_KEY
        sync: false
      - key: EVON_BASE_URL
        sync: false
      - key: EVON_API_KEY
        sync: false
      - key: EVON_MODEL
        value: gnani/gnani-evon-v3.3-30B-A3B
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ONLY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: DATA_DIR
        value: /tmp/likhkedo
